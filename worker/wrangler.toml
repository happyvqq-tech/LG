name = "lglearning-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# 保留本檔沒宣告的變數與 secret。
# 預設行為會把 Dashboard 上設定、但這裡沒列出的變數全部刪掉——
# 這會讓每次 Cloudflare 自動重建都洗掉 ANTHROPIC_API_KEY。
keep_vars = true

# 固定在新加坡執行，不要讓 Cloudflare 就近挑機房。
#
# 為什麼：Worker 預設在離使用者最近的機房執行，台灣的使用者會落在香港。
# 而 Anthropic 的 API 不服務香港，從那裡發出的請求會回 403「Request not allowed」。
# 症狀是時好時壞——同一個 Worker 有時被分到別的機房，重試就好了，
# 所以很容易誤以為是帳號或額度的問題。新加坡在 Anthropic 的服務範圍內，
# 離台灣也近（延遲遠小於一次 AI 呼叫的十幾秒）。
# 這個設定影響整個 Worker：語音、YouTube、Gemini 等其他呼叫也一律從新加坡發出。
[placement]
mode = "targeted"
region = "gcp:asia-southeast1"

# 正式環境的 CORS 白名單（GitHub Pages 網址，結尾不加斜線）
# 部署前改成你的 Pages 網址，例如 https://happyvqq-tech.github.io
[vars]
ALLOWED_ORIGIN = "https://happyvqq-tech.github.io"

# API key 不放這裡！用 secret（擇一）：
#   wrangler secret put ANTHROPIC_API_KEY   # Claude API
#   wrangler secret put YATING_API_KEY      # 雅婷 TTS（台語語音）
#   wrangler secret put GOOGLE_TTS_API_KEY  # Google Cloud TTS（英日韓語音）
#   或 Dashboard → Worker → Settings → Variables and secrets → 型別選 Secret
#
# YATING_API_KEY 沒設的話只有台語模組不能用，英日韓古文照常運作。
#
# GOOGLE_TTS_API_KEY 沒設也不會壞：前端連續失敗三次後就整個 session 改用瀏覽器
# 內建語音，只是音質會依裝置而異。要拿這把金鑰：GCP Console 建專案 → 啟用
# Cloud Text-to-Speech API → 憑證 → 建立 API 金鑰，並在金鑰設定裡限制成
# 「只能呼叫 Cloud Text-to-Speech API」。每月前 100 萬字元免費，還是建議去
# GCP 的帳單頁設一個預算警示。設好後開 /health 確認 google_tts_key 顯示已設定。
#   wrangler secret put ACCESS_PASSPHRASE   # 全家共用通關密碼（選配，見下）
#   或 Dashboard → Worker → Settings → Variables and secrets → 型別選 Secret
#
# YATING_API_KEY 沒設的話只有台語模組不能用，英日韓古文照常運作。
# ACCESS_PASSPHRASE 沒設的話任何人拿到網址都能直接用（原本的行為）；
# 設了之後 /api/chat、/api/tts 會要求前端夾帶同一組密碼才放行，
# 前端第一次會跳出輸入畫面，過一次後存在裝置的 localStorage 不用每次都輸入。
# 這道關卡只擋「打會花錢的 API」，不影響 Supabase（anon key 本來就設計成公開）。
