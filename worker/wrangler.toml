name = "lglearning-worker"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# 保留本檔沒宣告的變數與 secret。
# 預設行為會把 Dashboard 上設定、但這裡沒列出的變數全部刪掉——
# 這會讓每次 Cloudflare 自動重建都洗掉 ANTHROPIC_API_KEY。
keep_vars = true

# 正式環境的 CORS 白名單（GitHub Pages 網址，結尾不加斜線）
# 部署前改成你的 Pages 網址，例如 https://happyvqq-tech.github.io
[vars]
ALLOWED_ORIGIN = "https://happyvqq-tech.github.io"

# API key 不放這裡！用 secret（擇一）：
#   wrangler secret put ANTHROPIC_API_KEY   # Claude API
#   wrangler secret put YATING_API_KEY      # 雅婷 TTS（台語語音）
#   wrangler secret put ACCESS_PASSPHRASE   # 全家共用通關密碼（選配，見下）
#   或 Dashboard → Worker → Settings → Variables and secrets → 型別選 Secret
#
# YATING_API_KEY 沒設的話只有台語模組不能用，英日韓古文照常運作。
# ACCESS_PASSPHRASE 沒設的話任何人拿到網址都能直接用（原本的行為）；
# 設了之後 /api/chat、/api/tts 會要求前端夾帶同一組密碼才放行，
# 前端第一次會跳出輸入畫面，過一次後存在裝置的 localStorage 不用每次都輸入。
# 這道關卡只擋「打會花錢的 API」，不影響 Supabase（anon key 本來就設計成公開）。
